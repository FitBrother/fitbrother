<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 + user-scalable=no tiram o pinch-zoom do navegador —
         o app é um layout fixo tipo nativo, não conteúdo de leitura; um
         pinch acidental (comum rolando listas) quebra o layout inteiro. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <meta name="application-name" content="Fitbrother" />

    <!-- iOS Safari não lê manifest.json para o modo standalone; precisa destas tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fitbrother" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Captura o beforeinstallprompt o mais cedo possível, fora do React —
         o Chrome pode disparar esse evento antes do bundle (5+MB) terminar
         de carregar e montar, e o evento só dispara uma vez por carregamento
         de página. Um listener só dentro de um useEffect perderia esse
         disparo sempre que ele chegar antes da montagem; guardamos aqui pra
         useInstallPrompt.ts ler depois, sempre que montar. -->
    <script>
      window.__fbInstallPromptEvent = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__fbInstallPromptEvent = event;
      });
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Backstop pro maximum-scale/user-scalable do viewport acima —
           alguns navegadores ignoram esses dois pro gesto de double-tap
           (só pinch), então isso também corta o double-tap-zoom. */
        touch-action: pan-x pan-y;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* A margem padrão de 8px do body deixava o documento 8px mais alto que a
         viewport. Como o `overflow: hidden` acima proíbe o scroll do usuário
         mas não o programático, o navegador rolava esses 8px sozinho ao abrir
         o teclado (para revelar o input) e não voltava ao fechá-lo — o topo da
         tela ficava cortado sem forma de recuperar. Sem margem não há o que
         rolar. */
      body {
        margin: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
