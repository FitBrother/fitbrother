<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Codificação e viewport responsivo -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título da página -->
    <title>FitBrother — Nutrição com IA</title>

    <!-- Descrição para SEO em português -->
    <meta
      name="description"
      content="FitBrother é o seu parceiro de nutrição com inteligência artificial. Escaneie alimentos, acompanhe macros e alcance seus objetivos de saúde com orientação personalizada."
    />

    <!-- Favicon usando emoji de maçã verde -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍏</text></svg>"
    />

    <!-- Open Graph — compartilhamento em redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitBrother — Nutrição com IA" />
    <meta
      property="og:description"
      content="Seu parceiro de nutrição inteligente. Escaneie alimentos, acompanhe macros e transforme sua saúde com o poder da IA."
    />
    <meta property="og:url" content="https://fitbrother.app" />
    <meta property="og:image" content="https://fitbrother.app/og-image.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="FitBrother" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitBrother — Nutrição com IA" />
    <meta
      name="twitter:description"
      content="Seu parceiro de nutrição inteligente. Escaneie alimentos, acompanhe macros e transforme sua saúde com o poder da IA."
    />

    <!-- Google Fonts — Plus Jakarta Sans para títulos e Inter para corpo de texto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Ponto de montagem do React -->
    <div id="root"></div>

    <!-- Script principal do React (Vite) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
