# Supabase local config — `supabase start` reads this.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "fitbrother"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

# Necessário pro linkIdentity() (SignupBlock: vincula Google/Apple à sessão
# anônima do onboarding, em vez de criar uma sessão nova). Precisa do mesmo
# toggle habilitado no painel do Supabase Cloud em produção.
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Contas começam anônimas (signInAnonymously) e "viram reais" via
# updateUser(email, senha) — o Supabase trata isso como troca de e-mail, não
# cadastro, e usa este template por padrão ("Confirm Change of Email",
# mencionando e-mail antigo/novo — que não existe numa conta que começou
# anônima). Reescrito pra soar como ativação de conta. Espelha o mesmo texto
# configurado em produção via Dashboard (Authentication → Emails →
# Templates → Change Email Address) — config.toml só vale pro Supabase
# local, não sincroniza sozinho com o projeto hospedado.
[auth.email.template.email_change]
subject = "🎉 Confirme seu e-mail e ative sua conta no Fitbrother"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = false
enable_confirmations = true

# Dev: OTP fixo sem provider/custo. Em staging/prod, configure um provider real
# (Twilio/MessageBird) e remova/ajuste o test_otp.
[auth.sms.test_otp]
# Use estes pares número=código em dev (número em E.164 SEM o '+', sem aspas na
# chave — é o formato que o CLI mapeia pra GOTRUE_SMS_TEST_OTP). Substitua pelo
# número que você usar.
5511999999999 = "123456"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
