# Supabase local config — `supabase start` reads this.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "fitbrother"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = true

# Dev: OTP fixo sem provider/custo. Em staging/prod, configure um provider real
# (Twilio/MessageBird) e remova/ajuste o test_otp.
[auth.sms.test_otp]
# Use estes pares número=código em dev (número em E.164 SEM o '+', sem aspas na
# chave — é o formato que o CLI mapeia pra GOTRUE_SMS_TEST_OTP). Substitua pelo
# número que você usar.
5511999999999 = "123456"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
